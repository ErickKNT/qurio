<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-bottom" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#0B1020" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow-bottom)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Isotipo Qurio -->
  <g transform="translate(140, 160)">
    <!-- Base Icon Container -->
    <rect width="100" height="100" rx="24" fill="#111827" stroke="#334155" stroke-width="2" />
    <!-- Cilindro SVG -->
    <ellipse cx="50" cy="30" rx="26" ry="10" stroke="#818CF8" stroke-width="4" fill="#1E293B" />
    <ellipse cx="50" cy="30" rx="10" ry="4" fill="#22C55E" />
    <path d="M24 30v22c0 6 12 11 26 11s26-5 26-11V30" stroke="#818CF8" stroke-width="4" fill="none" />
    <path d="M24 52v22c0 6 12 11 26 11s26-5 26-11V52" stroke="#38BDF8" stroke-width="4" fill="none" />
  </g>

  <!-- Brand Title -->
  <text x="270" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="72" font-weight="800" fill="#F8FAFC" letter-spacing="-2">
    Qurio
  </text>

  <!-- Badge Pill -->
  <rect x="140" y="295" width="260" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="160" cy="313" r="4.5" fill="#22C55E" />
  <text x="175" y="318" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38BDF8">
    POSTGRESQL 16 SANDBOX
  </text>

  <!-- Tagline Motto -->
  <text x="140" y="390" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="700" fill="#F1F5F9" letter-spacing="-1">
    Aprende SQL. Piensa en queries.
  </text>

  <!-- Description -->
  <text x="140" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Plataforma interactiva de aprendizaje relacional con retroalimentación semántica instantánea.
  </text>

  <!-- Code snippet preview box -->
  <rect x="140" y="490" width="920" height="60" rx="12" fill="#080D1A" stroke="#1E293B" stroke-width="1.5" />
  <text x="170" y="528" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38BDF8">
    SELECT <tspan fill="#F8FAFC">cliente_id, nombre, total</tspan> FROM <tspan fill="#818CF8">pedidos</tspan> WHERE <tspan fill="#4AE176">status = 'completado'</tspan>;
  </text>
  <text x="960" y="528" font-family="'JetBrains Mono', monospace" font-size="14" fill="#22C55E">
    ✓ 3.2ms
  </text>
</svg>
