    <!-- Open Graph / Meta -->
    <meta name="theme-color" content="#0B1020" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Theme Initialization Script (Anti-FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('qurio_theme');
          var isDark = saved === 'dark' || (!saved && !window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-content-primary font-sans antialiased selection:bg-primary/30 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
