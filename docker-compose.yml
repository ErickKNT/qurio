services:
  # ============================================================================
  # Qurio: Isolated PostgreSQL Sandbox for Untrusted Student Queries
  # ============================================================================
  postgres-sandbox:
    image: postgres:16-alpine
    container_name: qurio-postgres-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ecommerce_sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_sandbox_master_pass
    volumes:
      - ./database/sandbox/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/sandbox/ecommerce_seed.sql:/docker-entrypoint-initdb.d/02_ecommerce_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - qurio-network

  # ============================================================================
  # Qurio: Execution & Semantic Evaluation API (FastAPI)
  # ============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: qurio-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SANDBOX_DB_HOST: postgres-sandbox
      SANDBOX_DB_PORT: 5432
      SANDBOX_DB_NAME: ecommerce_sandbox
      SANDBOX_DB_USER: readonly_student
      SANDBOX_DB_PASSWORD: student_safe_pass
    depends_on:
      postgres-sandbox:
        condition: service_healthy
    networks:
      - qurio-network

networks:
  qurio-network:
    driver: bridge
